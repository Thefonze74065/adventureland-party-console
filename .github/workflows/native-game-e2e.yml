name: Native game E2E (manual)

on:
  workflow_dispatch:
    inputs:
      grep:
        description: 'Optional Playwright title filter for focused diagnosis; empty runs the complete suite'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: native-game-e2e-${{ github.ref }}-${{ inputs.grep != '' && 'focused' || 'full' }}
  cancel-in-progress: false

jobs:
  native-game:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.grep != '' && '[1]' || '[1,2,3,4,5,6]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - run: npm ci
      - run: npm --prefix dashboard ci
      - run: node tools/caracal/setup.mts
      - run: npm --prefix .caracal ci
      - run: node scripts/ci/restore-game-fixtures.cjs
      - run: npx playwright install --with-deps chromium
      - name: Build and run native gameplay
        env:
          E2E_GREP: ${{ inputs.grep }}
        run: |
          if [ -n "$E2E_GREP" ]; then
            npm run test:e2e:live -- --workers=1 --grep "$E2E_GREP"
          else
            npm run test:e2e:live -- --fully-parallel --workers=1 --shard=${{ matrix.shard }}/6
          fi
      - name: Verify native evidence
        if: always()
        run: npm run test:e2e:verify
      - name: Preserve verifiable native game evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-game-e2e-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: |
            .build/e2e-report/
            .build/e2e-results/
            .build/e2e-live/server.log
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
