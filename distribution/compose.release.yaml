name: adventureland-party-console
services:
  party-console:
    image: ghcr.io/thefonze74065/adventureland-party-console:latest
    ports:
      - "${AL_HOST:-0.0.0.0}:${AL_PORT:-3010}:3010"
    environment:
      AL_PUBLIC_URL: ${AL_PUBLIC_URL:-}
      AL_DATA_URL: ${AL_DATA_URL:-https://aldata.earthiverse.ca}
      AL_UPDATER_URL: http://updater:925
      AL_MANAGED: '1'
    volumes:
      - party-data:/data
    depends_on:
      updater:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  updater:
    image: ghcr.io/thefonze74065/adventureland-party-console:latest
    user: root
    command: [node, tools/update/agent.mts]
    environment:
      AL_CONTAINER_UPDATER: '1'
    volumes:
      - party-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:925').then(r=>process.exit(r.status===401?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  party-data:
