name: al-e2e-pr21
services:
  database:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    image: ${E2E_MONGO_IMAGE:-mongo:7.0.16}
    command: ["mongod", "--replSet", "e2e", "--bind_ip", "127.0.0.1"]
    ports:
      - "${E2E_GAME_HOST:-127.0.0.1}:8083:8090"
      - "${E2E_GAME_HOST:-127.0.0.1}:9003:7192"
      - "${E2E_GAME_HOST:-127.0.0.1}:9004:7193"
    volumes:
      - database:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status() } catch(e) { rs.initiate({_id:'e2e',members:[{_id:0,host:'127.0.0.1:27017'}]}) }; if (!db.hello().isWritablePrimary) quit(1)"]
      interval: 2s
      timeout: 10s
      retries: 60
  game:
    environment:
      E2E_GAME_HOST: ${E2E_GAME_HOST:-127.0.0.1}
      E2E_CLOCK_RATE: ${E2E_CLOCK_RATE:-1}
      E2E_CLOCK_WALL_EPOCH: ${E2E_CLOCK_WALL_EPOCH:-0}
      E2E_CLOCK_VIRTUAL_EPOCH: ${E2E_CLOCK_VIRTUAL_EPOCH:-0}
      E2E_CHRONAL_DIR: /chronal
      E2E_CLOCK_BROKER: ${E2E_CLOCK_DOCKER_BROKER:-}
      E2E_CLOCK_TOKEN: ${E2E_CLOCK_TOKEN:-}
      E2E_CLOCK_SCOPE: game
    volumes:
      - ../../tools/sim:/party-sim:ro
      - ../../.build/sim/chronal/sim:/chronal/sim:ro
    build:
      context: .
      args:
        GAME_REV: ${E2E_GAME_REV:-90052162eb3ebda36c893e1eb4af643913c8f984}
        COMMON_REV: ${E2E_COMMON_REV:-fa74fabf5d3782503712621e037bfb934ecb8439}
        CONFIG_REV: ${E2E_CONFIG_REV:-6b3493be30abe367cfaf879a2d5ad370742e0866}
        NODE_IMAGE: ${E2E_NODE_IMAGE:-node:26.12.1-bookworm-slim@sha256:28147155d47dc31abe0a46e0d12b59b2fb3d0a2dcc5dc65fce76a074180b16fe}
    network_mode: "service:database"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "Promise.all([fetch('http://127.0.0.1:8090/'),...[7192,7193].map(port=>fetch('http://127.0.0.1:'+port+'/server.api/eval',{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body:new URLSearchParams({spass:'al-e2e-disposable-admin',code:'output=!!(server.live&&G.maps.main)'})}))]).then(async r=>{if(!r[0].ok||(await Promise.all(r.slice(1).map(v=>v.text()))).some(v=>v!=='true'))process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 10s
      retries: 60
volumes:
  database:
